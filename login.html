<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager - Iniciar Sesión</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>TaskManager</h1>
            <p>Ingresa a tu cuenta para gestionar tus proyectos</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="text" id="email" name="email" placeholder="ejemplo@gmail.com">
                <span class="error-message" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="********">
                    <button type="button" id="togglePassword" class="btn-toggle-pass">👁️</button>
                </div>
                
                <span class="error-message" id="password-error"></span>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
