<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager - Acceso</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>

    <div class="login-container">
        
        <div id="vista-login">
            <div class="login-header">
                <h1>TaskManager</h1>
                <p>Ingresa a tu cuenta para gestionar tus proyectos</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="text" id="email" name="email" placeholder="ejemplo@gmail.com">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="********">
                        <button type="button" id="togglePassword" class="btn-toggle-pass">👁️</button>
                    </div>
                    <span class="error-message" id="password-error"></span>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <div class="login-footer" style="margin-top: 15px; text-align: center;">
                <p>¿No tienes una cuenta? <a href="#" id="link-ir-registro" style="color: #007bff; text-decoration: none;">Regístrate aquí</a></p>
                <a href="#" style="display: block; margin-top: 10px; color: #666; font-size: 0.9em;">¿Olvidaste tu contraseña?</a>
            </div>
        </div>

        <div id="vista-registro" style="display: none;">
            <div class="login-header">
                <h1>TaskManager</h1>
                <p>Crea tu cuenta para empezar</p>
            </div>

            <form class="login-form" id="formulario-registro">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo</label>
                    <input type="text" id="reg-nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="reg-correo">Correo Electrónico</label>
                    <input type="email" id="reg-correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="Crea una contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <div class="login-footer" style="margin-top: 15px; text-align: center;">
                <p>¿Ya tienes cuenta? <a href="#" id="link-ir-login" style="color: #007bff; text-decoration: none;">Inicia sesión aquí</a></p>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
